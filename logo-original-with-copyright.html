<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Multiverse Coin Logo com Copyright</title>
    <style>
        * {
            margin: 0;

            display: flex;

            min-height: 100vh;

        }

        .logo-image {

            height: auto;
            display: block;
        }

        .copyright-overlay {
            position: absolute;
            bottom: 20px;

            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            padding: 0 20px;
        }

        /* Versão para captura de tela */
        .export-version {
            background: #0A2540;
            padding: 40px;
            border-radius: 10px;
        }

        .export-version .logo-image {
            max-width: 300px;
        }

        .export-version .copyright-overlay {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            bottom: 10px;
        }

</head>
