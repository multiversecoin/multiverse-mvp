<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverse Coin Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0A2540;
            font-family: 'Arial', sans-serif;
        }

        .logo-container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }

        .orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #3B82F6;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .orbit::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #3B82F6;
            border-radius: 50%;
            top: 50%;
            left: -10px;
            transform: translateY(-50%);
            box-shadow: 0 0 20px #3B82F6, 0 0 40px #3B82F6;
        }

        .m-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #3B82F6;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            z-index: 10;
        }

        .brand-name {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .copyright {
            font-size: 14px;
            color: #64748b;
            letter-spacing: 1px;
            margin-top: 30px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Static version for export */
        .logo-static .orbit {
            animation: none;
            transform: rotate(45deg);
        }

        .logo-static .orbit::before {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo">
            <div class="orbit"></div>
            <div class="m-logo">M</div>
        </div>
        <div class="brand-name">MULTIVERSE COIN</div>
        <div class="copyright">© 2026 Todos os direitos reservados.</div>
    </div>

    <script>
        // Add option to stop animation for screenshot
        document.addEventListener('keydown', (e) => {
            if (e.key === 's') {
                document.querySelector('.logo').classList.toggle('logo-static');
            }
        });
    </script>
</body>
</html>
