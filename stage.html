<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Multiverse - Stage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: radial-gradient(1200px 800px at 15% 10%, #16307a 0%, #0a1533 45%, #05091c 100%);
    color: #fff;
  }
  #stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; }
  .g1 { width: 700px; height: 700px; background: #1d4ed8; top: -220px; left: -180px; }
  .g2 { width: 620px; height: 620px; background: #06b6d4; bottom: -260px; right: 320px; opacity: .35; }

  #left { position: relative; width: 1120px; padding: 0 90px; }
  #kicker { font-size: 22px; letter-spacing: .32em; text-transform: uppercase; color: #63d2ff; font-weight: 600; opacity: 0; }
  #title { font-size: 76px; line-height: 1.05; font-weight: 800; margin-top: 18px; opacity: 0; }
  #sub { font-size: 30px; font-weight: 300; color: #c6d4f5; margin-top: 26px; max-width: 900px; opacity: 0; }
  ul { margin-top: 42px; list-style: none; }
  li { font-size: 30px; color: #e6eeff; margin-bottom: 22px; display: flex; align-items: center; gap: 18px; opacity: 0; transform: translateY(14px); }
  li b { color: #63d2ff; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #63d2ff; flex: none; box-shadow: 0 0 18px #63d2ff; }
  .fade-in { animation: fade .9s ease forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  #stats { display: flex; gap: 56px; margin-top: 54px; }
  .stat { opacity: 0; }
  .stat .v { font-size: 64px; font-weight: 800; color: #fff; }
  .stat .l { font-size: 22px; color: #9fb4e6; margin-top: 6px; }

  /* phone */
  #phoneWrap { position: relative; width: 800px; display: flex; justify-content: center; align-items: center;
    opacity: 0; transform: translateX(60px) scale(.96); transition: opacity .8s ease, transform .8s ease; }
  #phoneWrap.on { opacity: 1; transform: translateX(0) scale(1); }
  #phone { width: 452px; height: 954px; border-radius: 58px; padding: 11px; background: linear-gradient(160deg,#2b3a63,#0c1226);
    box-shadow: 0 50px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08); }
  #phone iframe { width: 430px; height: 932px; border: 0; border-radius: 48px; background: #fff; display: block; }

  /* hero / logo mode */
  #hero { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
  #hero.on { opacity: 1; }
  #hero img { width: 300px; border-radius: 34px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  #hero .name { font-size: 92px; font-weight: 800; letter-spacing: .04em; }
  #hero .tag { font-size: 32px; font-weight: 300; color: #c6d4f5; }
  #hero .link { margin-top: 12px; font-size: 28px; color: #63d2ff; font-weight: 600; }

  #brand { position: absolute; top: 54px; left: 90px; display: flex; align-items: center; gap: 18px; opacity: .95; }
  #brand img { width: 62px; border-radius: 12px; }
  #brand span { font-size: 26px; font-weight: 600; letter-spacing: .22em; }
  #footer { position: absolute; bottom: 44px; left: 90px; font-size: 20px; color: #7e93c7; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow g1"></div>
  <div class="glow g2"></div>

  <div id="brand"><img src="logo.jpg" alt="logo" /><span>MULTIVERSE</span></div>

  <div id="left">
    <div id="kicker"></div>
    <h1 id="title"></h1>
    <div id="sub"></div>
    <ul id="bullets"></ul>
    <div id="stats"></div>
  </div>

  <div id="phoneWrap">
    <div id="phone"><iframe id="app" src="index.html"></iframe></div>
  </div>

  <div id="hero">
    <img src="logo.jpg" alt="Multiverse Coin" />
    <div class="name">MULTIVERSE</div>
    <div class="tag" id="heroTag">Economia Digital Territorial</div>
    <div class="link" id="heroLink"></div>
  </div>

  <div id="footer">Multiverse Coin · Moema, São Paulo · © 2026</div>
</div>

<script>
  const $ = (s) => document.querySelector(s);

  function reveal(el, delay) {
    el.classList.remove('fade-in');
    el.style.animation = '';
    void el.offsetWidth;
    el.style.animationDelay = (delay || 0) + 'ms';
    el.classList.add('fade-in');
  }

  window.setSlide = function (o) {
    $('#kicker').textContent = o.kicker || '';
    $('#title').innerHTML = o.title || '';
    $('#sub').innerHTML = o.sub || '';
    const ul = $('#bullets');
    ul.innerHTML = '';
    (o.bullets || []).forEach((b) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot"></span><span>' + b + '</span>';
      ul.appendChild(li);
    });
    const st = $('#stats');
    st.innerHTML = '';
    (o.stats || []).forEach((s) => {
      const d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = '<div class="v">' + s.v + '</div><div class="l">' + s.l + '</div>';
      st.appendChild(d);
    });

    let t = 0;
    [$('#kicker'), $('#title'), $('#sub')].forEach((el) => { if (el.textContent) { reveal(el, t); t += 350; } });
    ul.querySelectorAll('li').forEach((li) => { reveal(li, t); t += 700; });
    st.querySelectorAll('.stat').forEach((el) => { reveal(el, t); t += 500; });
  };

  window.showPhone = function (on) { $('#phoneWrap').classList.toggle('on', !!on); };
  window.showHero = function (on, link) {
    $('#heroLink').textContent = link || '';
    $('#hero').classList.toggle('on', !!on);
    $('#left').style.opacity = on ? 0 : 1;
    $('#brand').style.opacity = on ? 0 : .95;
  };
  window.appCall = function (fn, args) { const w = $('#app').contentWindow; return w[fn].apply(w, args || []); };
  window.appScroll = function (y, smooth) {
    const w = $('#app').contentWindow;
    w.scrollTo({ top: y, behavior: smooth === false ? 'auto' : 'smooth' });
  };
</script>
</body>
</html>
