        // SECURITY GUARDRAILS - Proteção contra prompts maliciosos

        const SecurityConfig = {
            rateLimits: {
                transactions: {
                    maxPerHour: 10,
                    maxPerDay: 50,
                    cooldownMs: 30000 // 30 segundos
                },
                loginAttempts: {
                    maxAttempts: 5,
                    lockoutMs: 300000 // 5 minutos
                }
            },
            transactionLimits: {
                maxSingleTransaction: 10000,
                maxDailyTotal: 50000,
                minTransaction: 0.01,
                requireConfirmationAbove: 100
            }
        };

        let SecurityState = {
            transactionHistory: [],
            lastTransactionTime: 0,
            failedAttempts: 0,
            lockoutUntil: null,
            suspiciousActivityDetected: false
        };

        // Sanitização de input contra XSS
        function sanitizeInput(input) {
            if (typeof input !== 'string') return '';
            return input
                .replace(/[<>]/g, '')
                .replace(/javascript:/gi, '')
                .replace(/on\w+\s*=/gi, '')
                .replace(/data:/gi, '')
                .replace(/vbscript:/gi, '')
                .trim()
                .substring(0, 1000);
        }

        // Validação de valor
        function validateAmount(amount) {
            if (typeof amount !== 'number' || isNaN(amount)) {
                return { valid: false, error: 'Valor inválido' };
            }
            if (amount < SecurityConfig.transactionLimits.minTransaction) {
                return { valid: false, error: `Valor mínimo é ${SecurityConfig.transactionLimits.minTransaction} MCC` };
            }
            if (amount > SecurityConfig.transactionLimits.maxSingleTransaction) {
                return { valid: false, error: `Valor máximo é ${SecurityConfig.transactionLimits.maxSingleTransaction} MCC` };
            }
            if (amount <= 0) {
                return { valid: false, error: 'Valor deve ser positivo' };
            }
            return { valid: true };
        }

        // Rate limiting
        function checkRateLimit() {
            const now = Date.now();

            if (SecurityState.lockoutUntil && now < SecurityState.lockoutUntil) {
                const waitTime = Math.ceil((SecurityState.lockoutUntil - now) / 1000);
                return {
                    allowed: false,
                    error: 'Muitas tentativas. Tente novamente mais tarde.',
                    waitTime
                };
            }

            if (SecurityState.lastTransactionTime) {
                const timeSinceLastTransaction = now - SecurityState.lastTransactionTime;
                if (timeSinceLastTransaction < SecurityConfig.rateLimits.transactions.cooldownMs) {
                    const waitTime = Math.ceil((SecurityConfig.rateLimits.transactions.cooldownMs - timeSinceLastTransaction) / 1000);
                    return {
                        allowed: false,
                        error: 'Aguarde antes de fazer outra transação.',
                        waitTime
                    };
                }
            }

            const oneHourAgo = now - 3600000;
            const recentTransactions = SecurityState.transactionHistory.filter(
                timestamp => timestamp > oneHourAgo
            );

            if (recentTransactions.length >= SecurityConfig.rateLimits.transactions.maxPerHour) {
                return {
                    allowed: false,
                    error: 'Limite de transações por hora atingido.'
                };
            }

            return { allowed: true };
        }

        // Registrar transação
        function recordTransaction() {
            const now = Date.now();
            SecurityState.transactionHistory.push(now);
            SecurityState.lastTransactionTime = now;
            SecurityState.failedAttempts = 0;
        }

        // Registrar falha
        function recordFailedAttempt() {
            SecurityState.failedAttempts++;
            if (SecurityState.failedAttempts >= SecurityConfig.rateLimits.loginAttempts.maxAttempts) {
                SecurityState.lockoutUntil = Date.now() + SecurityConfig.rateLimits.loginAttempts.lockoutMs;
                SecurityState.suspiciousActivityDetected = true;
            }
        }

        // Validar merchant ID
        function validateMerchantId(merchantId) {
            if (typeof merchantId !== 'string') {
                return { valid: false, error: 'ID de estabelecimento inválido' };
            }
            const sanitized = sanitizeInput(merchantId);
            if (!/^[a-zA-Z0-9-_]+$/.test(sanitized)) {
                return { valid: false, error: 'ID de estabelecimento contém caracteres inválidos' };
            }
            if (sanitized.length > 50 || sanitized.length < 1) {
                return { valid: false, error: 'ID de estabelecimento com tamanho inválido' };
            }
            return { valid: true };
        }

        // Detecção de atividade suspeita
        function detectSuspiciousActivity(pattern) {
            const { amount, frequency, timeOfDay } = pattern;

            if (amount > SecurityConfig.transactionLimits.maxSingleTransaction * 0.8) {
                return { suspicious: true, reason: 'Valor acima do normal' };
            }

            if (frequency > SecurityConfig.rateLimits.transactions.maxPerHour * 0.5) {
                return { suspicious: true, reason: 'Alta frequência de transações' };
            }

            if (timeOfDay >= 2 && timeOfDay <= 5) {
                return { suspicious: true, reason: 'Horário incomum' };
            }

            return { suspicious: false };
        }

        // Validação completa de transação
        function validateTransactionRequest(request) {
            const merchantValidation = validateMerchantId(request.merchantId);
            if (!merchantValidation.valid) {
                return { valid: false, error: merchantValidation.error };
            }

            const amountValidation = validateAmount(request.amount);
            if (!amountValidation.valid) {
                return { valid: false, error: amountValidation.error };
            }

            const rateLimitCheck = checkRateLimit();
            if (!rateLimitCheck.allowed) {
                return { valid: false, error: rateLimitCheck.error };
            }

            const now = new Date();
            const suspiciousCheck = detectSuspiciousActivity({
                amount: request.amount,
                frequency: SecurityState.transactionHistory.filter(
                    t => t > Date.now() - 3600000
                ).length,
                timeOfDay: now.getHours()
            });

            if (suspiciousCheck.suspicious) {
                console.log('[SECURITY] Atividade suspeita detectada:', suspiciousCheck.reason);
            }

            const needsConfirmation = request.amount >= SecurityConfig.transactionLimits.requireConfirmationAbove;

            return {
                valid: true,
                requiresConfirmation: needsConfirmation,
                suspicious: suspiciousCheck.suspicious,
                reason: suspiciousCheck.reason
            };
        }

        // Gerar token seguro

            const array = new Uint32Array(4);
            crypto.getRandomValues(array);
            return Array.from(array, dec => dec.toString(16)).join('');
        }

            const lockoutRemaining = SecurityState.lockoutUntil

            return {
                isLocked: lockoutRemaining > 0,
                suspiciousActivity: SecurityState.suspiciousActivityDetected,
                failedAttempts: SecurityState.failedAttempts,

        function makeTransaction(merchantId, amount, cashbackPercent) {
            // Security validation
            const securityValidation = validateTransactionRequest({
                amount: amount,
                merchantId: merchantId,
                userId: user.id
            });

            if (!securityValidation.valid) {
                alert(`❌ ${securityValidation.error}`);
                recordFailedAttempt();
                return;
            }

            if (securityValidation.suspicious) {
                alert(`⚠️ Atividade suspeita detectada: ${securityValidation.reason}\n\nPor segurança, esta transação requer verificação adicional.`);
                return;
            }

            if (securityValidation.requiresConfirmation) {
                const confirmed = confirm(`⚠️ Transação de alto valor detectada!\n\nValor: R$ ${amount.toFixed(2)}\n\nDeseja confirmar esta transação?`);
                if (!confirmed) {
                    return;
                }
            }

            const merchant = demoMerchants.find(m => m.id === merchantId);
            if (!merchant) return;

            const cashback = amount * (cashbackPercent / 100);
            const impact = amount * 0.01;

            // Generate secure token
            const secureToken = generateSecureToken();

            const newTransaction = {
                id: Date.now().toString(),
                merchantId,
                merchantName: merchant.name,
                amount,
                cashback,
                impact,
                date: new Date(),
                type: 'purchase',
                securityToken: secureToken.substring(0, 8) + '...' // Store partial token
            };

            transactions.unshift(newTransaction);
            user.balance = user.balance - amount + cashback;
            user.impact = user.impact + impact;

            // Record transaction for rate limiting
            recordTransaction();

            console.log('[SECURITY] Transação aprovada com token:', secureToken);

            alert(`✅ Transação realizada com sucesso!\n\nEstabelecimento: ${merchant.name}\nValor: R$ ${amount.toFixed(2)}\nCashback: ${cashback.toFixed(2)} MCC\nImpacto: R$ ${impact.toFixed(2)}\n\nToken de segurança: ${secureToken.substring(0, 8)}...`);

            currentView = 'wallet';
            render();
        }

        function attachEventListeners() {
            // Event listeners are attached inline via onclick attributes
        }

        // Initial render
        render();
    </script>
</body>
